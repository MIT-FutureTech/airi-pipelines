[project]
name = "airi-pipelines"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "basedpyright>=1.38",
    "pytest>=9",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15",
]

[tool.uv.workspace]
members = ["toolbox-lib"]

[tool.uv.sources]
toolbox = { workspace = true }

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "recommended"
# Allow implicit and explicit uses of `Any`. It's sometimes warranted.
reportAny = false
reportExplicitAny = false
# Don't require return values to be assigned to variables. Common functions like
# `await asyncio.gather()` have non-None return values, but those return values
# often aren't important. This rule can create a lot of noise.
reportUnusedCallResult = false

executionEnvironments = [
    # Tools are allowed to access private attributes
    { root = "toolbox-lib/tests", reportPrivateUsage = false },
]

[tool.ruff]
src = ["toolbox-lib/src"]
target-version = "py312"

[tool.ruff.lint]
preview = true
explicit-preview-rules = true

select = [
    "A",     # builtin shadowing
    "ARG",   # unused arguments
    "B",     # bugbear
    "C4",    # comprehension flaws
    "DTZ",   # naive datetime usage
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "G",     # flake8-logging-format
    "I",     # isort
    "LOG",   # flake8-logging
    "N",     # pep8-naming
    "PLC",   # pylint convention
    "PLE",   # pylint errors
    "PLW",   # pylint warnings
    "PT",    # pytest style
    "PTH",   # pathlib preference
    "RET",   # return style
    "RUF",   # ruff-specific rules
    "RUF027",# Possible f-string without an `f` prefix
    "S110",  # `try`-`except`-`pass` detected, consider logging the exception
    "S112",  # `try`-`except`-`continue` detected, consider logging the exception
    "SIM",   # simplify
    "T20",   # print statements
    "TRY",   # tryceratops exception handling
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]
ignore = [
    "E501",   # Line too long. We let `ruff format` handle formatting.
    "G004",   # Logging statement uses f-string
    "TRY003", # Avoid specifying long messages outside the exception class
    "SIM105", # Use `contextlib.suppress(Exception)`. Disabled because we don't want to suppress exceptions.
]

[tool.ruff.lint.per-file-ignores]
# Relax some rules for code in the pipelines/ directory
"pipelines/*" = [
    "T201",  # `print` found
]

[tool.pytest]
addopts = [
    "--import-mode=importlib",
    "-m not network",
]
markers = [
    "network: tests that make real requests to remote services (use -m network to run)",
]
asyncio_mode = "auto"
filterwarnings = ["error"]
strict = true
testpaths = ["toolbox-lib/tests"]
xfail_strict = true
