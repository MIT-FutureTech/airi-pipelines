[project]
name = "org-mitigations"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "toolbox",
    "tqdm>=4.67.3",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
toolbox = { workspace = true }
