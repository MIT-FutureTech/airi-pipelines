[project]
name = "toolbox"
version = "0.1.0"
description = "Shared, pipeline-agnostic code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "openai>=1.70",
    "pydantic>=2.12",
    "pymupdf>=1.27",
    "pymupdf4llm>=1.27",
    "tenacity>=9",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"
