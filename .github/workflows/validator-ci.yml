name: Risk Repository Validator CI

on:
  push:
    branches:
      - main
    paths:
      - "pipelines/risk-repository/validator/**"
      - ".github/workflows/validator-ci.yml"
  pull_request:
    paths:
      - "pipelines/risk-repository/validator/**"
      - ".github/workflows/validator-ci.yml"

defaults:
  run:
    shell: bash
    working-directory: pipelines/risk-repository/validator

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipelines/risk-repository/validator/package-lock.json

      - run: npm ci

      - name: Format
        run: npx biome format

      - name: Lint
        run: npx biome lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipelines/risk-repository/validator/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          npx wrangler deploy \
            --tag "${GITHUB_SHA::7}" \
            --message "$(git log -1 --pretty=%s) (deployed by $ACTOR)"
