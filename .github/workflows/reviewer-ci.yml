name: Organization Mitigations Reviewer CI

on:
  push:
    branches:
      - main
    paths:
      - "pipelines/org-mitigations/reviewer/**"
      - ".github/workflows/reviewer-ci.yml"
  pull_request:
    paths:
      - "pipelines/org-mitigations/reviewer/**"
      - ".github/workflows/reviewer-ci.yml"

defaults:
  run:
    working-directory: pipelines/org-mitigations/reviewer

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipelines/org-mitigations/reviewer/package-lock.json

      - run: npm ci

      - name: Format
        run: npx biome format

      - name: Lint
        run: npx biome lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm run test
